name: Release

# Push a tag like v1.5.1 to build the Windows installers and publish a GitHub
# Release with generated changelog notes. The in-app updater reads the latest
# release and picks the first .exe/.msi asset, so assets must stay attached.
#
#   git tag v1.5.1 && git push origin v1.5.1
#
# "Run workflow" from the Actions tab does a dry build of the chosen ref: it
# builds and uploads the installers as a workflow artifact but publishes nothing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that tag and app versions agree
        id: v
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"

          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::Version mismatch between package.json, tauri.conf.json and Cargo.toml"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$pkg" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match app version $pkg. The updater compares these, so bump all three files first."
              exit 1
            fi
          fi

          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          case "$pkg" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  create-release:
    name: Draft release with changelog
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags are needed to diff against the previous release

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog
        run: node scripts/generate-changelog.mjs "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/CHANGELOG.md"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create draft release
        id: release
        uses: actions/github-script@v7
        env:
          NOTES_PATH: ${{ runner.temp }}/CHANGELOG.md
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const body = fs.readFileSync(process.env.NOTES_PATH, 'utf8');

            // Re-running a failed release reuses the existing draft instead of failing.
            const { data: releases } = await github.rest.repos.listReleases({
              ...context.repo, per_page: 50,
            });
            const existing = releases.find((r) => r.tag_name === tag);

            const payload = {
              ...context.repo,
              tag_name: tag,
              name: `Kivo ${tag}`,
              body,
              draft: true,
              prerelease: process.env.PRERELEASE === 'true',
            };

            const { data } = existing
              ? await github.rest.repos.updateRelease({ ...payload, release_id: existing.id })
              : await github.rest.repos.createRelease(payload);

            core.setOutput('id', data.id);

  build-windows:
    name: Build Windows installers
    needs: [verify, create-release]
    # Run for tags (after the draft exists) and for manual dry runs (no draft).
    if: ${{ always() && needs.verify.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers to the draft release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: baked into the frontend at build time. Leave the secrets
          # unset to use the defaults compiled into the app.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          projectPath: .
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Build installers (dry run)
        if: github.ref_type != 'tag'
        run: npm run tauri -- build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload installers as workflow artifact (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: kivo-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [create-release, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });

            const hasInstaller = release.assets.some((a) => /\.(exe|msi)$/i.test(a.name));
            if (!hasInstaller) {
              core.setFailed('No .exe/.msi installer was attached to the draft release; leaving it unpublished.');
              return;
            }

            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id,
              draft: false,
              // Pre-releases must not become "latest", or the updater would offer them.
              make_latest: release.prerelease ? 'false' : 'true',
            });
            core.info(`Published ${release.tag_name} with ${release.assets.length} assets.`);
