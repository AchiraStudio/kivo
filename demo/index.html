<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kivo: POS, stock and books that keep working offline</title>
    <meta name="description" content="Kivo is an offline-first POS and ERP for retail, pharmacy and F&B. Windows and Android, live demo inside." />
    <meta property="og:title" content="Kivo: run the store, even offline" />
    <meta property="og:description" content="POS, stock, members and books on Windows and Android. Try the real app in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./icon.png" />
    <meta name="theme-color" content="#0e1013" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <script>
      // Apply the saved theme before first paint.
      (function () {
        try {
          var t = localStorage.getItem('kivo-site-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
